# ==============================================================================
# AUTHENTICATION
# ==============================================================================
txt_UserName = name=username
txt_Password = name=password
btn_Login = id=page_x002e_components_x002e_slingshot-login_x0023_default-submit-button
link_HeaderUserMenu = id=HEADER_USER_MENU_POPUP_text
link_HeaderDeconnexion = id=HEADER_USER_MENU_LOGOUT_text

# ==============================================================================
# GROUP MANAGEMENT (indépendants de la langue de l'interface)
# ==============================================================================
btn_ParcourirGroupes      = id=page_x002e_ctool_x002e_admin-console_x0023_default-browse-button-button
btn_new_group             = xpath=(//span[contains(@class,'groups-newgroup-button')])[1]
input_group_identifier    = id=page_x002e_ctool_x002e_admin-console_x0023_default-create-shortname
input_group_display_name  = id=page_x002e_ctool_x002e_admin-console_x0023_default-create-displayname
btn_create_group          = xpath=//button[contains(@id,'default-creategroup-button-button') or (contains(@id,'creategroup') and not(contains(@id,'another')))]

group_items_all           = xpath=//a[contains(@class,'groups-item-group')]
group_item                = xpath=//a[contains(@class,'groups-item-group') and .//span[contains(@class,'yui-columnbrowser-item-label') and (normalize-space(.)='GROUP_NAME' or starts-with(normalize-space(.),'GROUP_NAME ('))]]
group_delete_icon         = xpath=//a[contains(@class,'groups-item-group') and .//span[contains(@class,'yui-columnbrowser-item-label') and (normalize-space(.)='GROUP_NAME' or starts-with(normalize-space(.),'GROUP_NAME ('))]]//span[contains(@class,'groups-delete-button')]
group_delete_icon_any     = xpath=(//a[contains(@class,'yui-columnbrowser-item-selected')]//span[contains(@class,'groups-delete-button')] | //a[contains(@class,'yui-columnbrowser-item-selected')]/following-sibling::span[contains(@class,'groups-delete-button')][1])[1]
btn_confirm_delete_group  = xpath=//button[contains(@id,'default-remove-button-button')]

# ------------------------------------------------------------------------------
# SOUS-GROUPES (ajout d'un groupe existant comme membre, puis retrait)
# ------------------------------------------------------------------------------
btn_add_group_member      = xpath=(//span[contains(@class,'groups-addgroup-button')])[last()]
groupfinder_input         = xpath=//input[contains(@id,'groupfinder-search-text')]
groupfinder_search_btn    = xpath=//button[contains(@id,'groupfinder-group-search-button-button')]
groupfinder_result_add    = xpath=(//div[contains(@id,'groupfinder')]//tr[contains(.,'GROUP_NAME')]//button)[1]
group_member_remove_icon  = xpath=(//a[contains(@class,'groups-item-group') and .//span[contains(@class,'yui-columnbrowser-item-label') and (normalize-space(.)='GROUP_NAME' or starts-with(normalize-space(.),'GROUP_NAME ('))]])[last()]//span[contains(@class,'groups-delete-button')]
