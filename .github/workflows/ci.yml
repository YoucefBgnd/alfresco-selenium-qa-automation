name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compilation Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Les tests ont besoin d'une instance Alfresco accessible : la CI valide donc
      # la compilation du code et des tests (sans les exécuter).
      - name: Compiler le projet et les tests
        run: mvn -B -ntp test-compile
